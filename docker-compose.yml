services:
  # M11/H1: MySQL (the code uses aiomysql/pymysql — Postgres was documented but never wired up)
  mysql:
    image: mysql:8.4
    container_name: dtmn_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dtmn_db}
      MYSQL_USER: ${MYSQL_USER:-dtmn_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    ports:
      # M11: Bind to 127.0.0.1 only — do not expose DB to the network
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-dtmn_user}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: phpMyAdmin for local dev — NEVER expose in production
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: dtmn_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER:-dtmn_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    ports:
      # M11: Bind to 127.0.0.1 only
      - "127.0.0.1:8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      # Only starts when explicitly requested: docker compose --profile tools up
      - tools

volumes:
  mysql_data:
